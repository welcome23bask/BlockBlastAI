name: Build iPhone Block Blast AI Dylib
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'simulator/**'
      - 'benchmark/**'
      - '.github/workflows/build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test standalone solver
        run: |
          clang -std=c11 -O2 -Wall -Wextra tests/test_solver.c src/BlockBlastSolver.c -o /tmp/blsolver-test
          /tmp/blsolver-test
      - name: Verify 300 randomized solver states against independent move rules
        run: |
          clang -std=c11 -O2 -Wall -Wextra tests/test_solver_paths.c src/BlockBlastSolver.c -o /tmp/blpaths-test
          /tmp/blpaths-test
      - name: Verify fast-path only accepts exact next move
        run: |
          clang -std=c11 -O2 -Wall -Wextra tests/test_transition.c src/BLTransition.c src/BlockBlastSolver.c -o /tmp/bltransition-test
          /tmp/bltransition-test
      - name: Regression test board vision and orientation
        run: |
          clang -std=c11 -O2 -Wall -Wextra tests/test_vision.c src/BLVisionCore.c src/BLAdaptiveTheme.c -lm -o /tmp/blvision-test
          /tmp/blvision-test
      - name: Test brown/wood theme colors and 8x8 board alignment
        run: |
          clang -std=c11 -O2 -Wall -Wextra tests/test_wood_theme.c src/BLVisionCore.c src/BLAdaptiveTheme.c -lm -o /tmp/blwood-test
          /tmp/blwood-test
      - name: Test browser simulator core
        run: |
          node simulator/test.js
      - name: Benchmark v0.9 against working v0.8.2 (2000 paired games)
        run: |
          clang -O3 -std=c11 -Isrc -DBLSolve=BLOldSolve -c benchmark/v082_solver.c -o /tmp/bl_old.o
          clang -O3 -std=c11 -Isrc -c src/BlockBlastSolver.c -o /tmp/bl_new.o
          clang -O3 -std=c11 benchmark/benchmark.c /tmp/bl_old.o /tmp/bl_new.o -o /tmp/bl_bench
          /tmp/bl_bench 2000 120 | tee benchmark/results_2000.txt
      - name: Holdout quality gate — 1000 unseen seeded games
        run: |
          /tmp/bl_bench 1000 120 50000 | tee benchmark/holdout_1000.txt
      - name: Compile ARM64 iOS tweak
        run: |
          mkdir -p dist
          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios15.0 \
            -arch arm64 \
            -O2 -fobjc-arc -std=gnu11 \
            -dynamiclib \
            -install_name @rpath/BlockBlastAI.dylib \
            -framework Foundation -framework UIKit -framework CoreGraphics -framework ReplayKit -framework CoreMedia -framework CoreVideo -framework CoreImage \
            src/BlockBlastOverlay.m src/BLScreenScan.m src/BLVisionCore.c src/BLAdaptiveTheme.c src/BLTransition.c src/BlockBlastSolver.c \
            -o dist/BlockBlastAI.dylib
          file dist/BlockBlastAI.dylib
          cp simulator/index.html dist/BlockBlastAI_Simulator.html
      - name: Package complete replacement source files for iPhone upload
        run: |
          mkdir -p dist/replacements/src dist/replacements/tests dist/replacements/benchmark dist/replacements/.github/workflows
          cp src/BLScreenScan.m src/BlockBlastOverlay.m src/BlockBlastSolver.c src/BLTransition.c src/BLTransition.h src/BLVisionCore.c src/BLVisionCore.h src/BLAdaptiveTheme.c src/BLAdaptiveTheme.h dist/replacements/src/
          cp tests/test_solver.c tests/test_solver_paths.c tests/test_transition.c tests/test_wood_theme.c tests/test_vision.c dist/replacements/tests/
          cp benchmark/v082_solver.c benchmark/benchmark.c benchmark/results_2000.txt benchmark/holdout_1000.txt dist/replacements/benchmark/
          cp .github/workflows/build.yml dist/replacements/.github/workflows/
          (cd dist/replacements && zip -qr ../BlockBlastAI_v1.1_Replacement_Files.zip .)

      - name: Upload unsigned dylib
        uses: actions/upload-artifact@v4
        with:
          name: BlockBlastAI-v11-theme-fast-iOS-arm64
          path: dist/BlockBlastAI.dylib

      - name: Publish direct-download GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.7 >/dev/null 2>&1; then
            gh release create v0.7 --title "BlockBlastAI v0.7 (experimental)" --notes "Experimental v0.7: shared Core Image context, capture watchdog and recovery, restored highlights after transient scans, deduplicated combo-aware solver benchmarked against original v0.6. Device operation unverified."
          fi
          gh release upload v0.7 dist/BlockBlastAI.dylib dist/BlockBlastAI_Simulator.html dist/BlockBlastAI_v0.7_Replacement_Files.zip --clobber
