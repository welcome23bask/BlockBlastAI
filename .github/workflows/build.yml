name: Build iPhone Block Blast AI Dylib
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test standalone solver
        run: |
          clang -std=c11 -O2 -Wall -Wextra tests/test_solver.c src/BlockBlastSolver.c -o /tmp/blsolver-test
          /tmp/blsolver-test
      - name: Compile ARM64 iOS tweak
        run: |
          mkdir -p dist
          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios15.0 \
            -arch arm64 \
            -O2 -fobjc-arc -std=gnu11 \
            -dynamiclib \
            -install_name @rpath/BlockBlastAI.dylib \
            -framework Foundation -framework UIKit -framework CoreGraphics -framework ReplayKit -framework CoreMedia -framework CoreVideo -framework CoreImage \
            src/BlockBlastOverlay.m src/BLScreenScan.m src/BlockBlastSolver.c \
            -o dist/BlockBlastAI.dylib
          file dist/BlockBlastAI.dylib
      - name: Upload unsigned dylib
        uses: actions/upload-artifact@v4
        with:
          name: BlockBlastAI-iOS-arm64
          path: dist/BlockBlastAI.dylib

      - name: Publish direct-download GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.4 >/dev/null 2>&1; then
            gh release create v0.4 --title "BlockBlastAI v0.4 (experimental)" --notes "Unsigned v0.4 beta: automatic board location, three-piece tray detection, repeated screen scans, live move solving and highlights on the actual board. Experimental: trained on a sample Block Blast screenshot; not device-tested. Keep v0.1 as fallback."
          fi
          gh release upload v0.4 dist/BlockBlastAI.dylib --clobber
