name: Build iPhone Block Blast AI Dylib
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'simulator/**'
      - '.github/workflows/build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test standalone solver
        run: |
          clang -std=c11 -O2 -Wall -Wextra tests/test_solver.c src/BlockBlastSolver.c -o /tmp/blsolver-test
          /tmp/blsolver-test
      - name: Regression test board vision and orientation
        run: |
          clang -std=c11 -O2 -Wall -Wextra tests/test_vision.c src/BLVisionCore.c -lm -o /tmp/blvision-test
          /tmp/blvision-test
      - name: Test browser simulator core
        run: |
          node simulator/test.js
      - name: Compile ARM64 iOS tweak
        run: |
          mkdir -p dist
          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios15.0 \
            -arch arm64 \
            -O2 -fobjc-arc -std=gnu11 \
            -dynamiclib \
            -install_name @rpath/BlockBlastAI.dylib \
            -framework Foundation -framework UIKit -framework CoreGraphics -framework ReplayKit -framework CoreMedia -framework CoreVideo -framework CoreImage \
            src/BlockBlastOverlay.m src/BLScreenScan.m src/BLVisionCore.c src/BlockBlastSolver.c \
            -o dist/BlockBlastAI.dylib
          file dist/BlockBlastAI.dylib
          cp simulator/index.html dist/BlockBlastAI_Simulator.html
      - name: Upload unsigned dylib
        uses: actions/upload-artifact@v4
        with:
          name: BlockBlastAI-iOS-arm64
          path: dist/BlockBlastAI.dylib

      - name: Publish direct-download GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.6 >/dev/null 2>&1; then
            gh release create v0.6 --title "BlockBlastAI v0.6 (experimental)" --notes "Unsigned experimental v0.6 live overlay plus self-contained browser simulator. Persistent ReplayKit session prevents repeated start-stop races. Auto recovery and consistency checks reduce lost highlights and false tray pieces. Browser simulator tested with repeatable fault injection. On-device gameplay still requires verification."
          fi
          gh release upload v0.6 dist/BlockBlastAI.dylib dist/BlockBlastAI_Simulator.html --clobber
