name: v2.2 10x Challenge - Bounded Offline Research
on:
  workflow_dispatch:
  push:
    branches: [feature/v2.2-10x-research-gate]
    paths:
      - '.github/workflows/v22-tenx.yml'

permissions:
  contents: read

concurrency:
  group: blockblast-tenx-research
  cancel-in-progress: false

jobs:
  bounded-research:
    if: github.ref == 'refs/heads/feature/v2.2-10x-research-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact research revision and baseline
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cat learning/tenx_checkpoint.txt
          cat learning/tenx_candidate_weights.txt
      - name: Compile exact source and run one bounded training epoch with two synthetic holdouts
        id: research
        shell: bash
        run: |
          set -o pipefail
          # Epochs are provisional: the full historical seed ledger must still be audited.
          # Iteration 19: expand combo-safe neighborhood search after 0/7 feasible in iteration 18.
          # Distinct provisional training epoch 1819; three games per generator, 21 candidates, one epoch.
          # The runner rejects failing verdicts. Never promote a candidate from this job.
          TENX_TRAIN_SEED_EPOCH=1819 bash learning/run_tenx_reproducible.sh 1909 1910 2>&1 | tee /tmp/tenx-research-console.txt
      - name: Preserve all available research evidence even on failed gates
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/tenx-upload
          cp /tmp/tenx-research-console.txt /tmp/tenx-upload/console.txt 2>/dev/null || true
          evidence="$(sed -n 's/^EVIDENCE_DIRECTORY=//p' /tmp/tenx-research-console.txt 2>/dev/null | tail -n 1)"
          if [[ -n "$evidence" && -d "$evidence" ]]; then
            cp -a "$evidence"/. /tmp/tenx-upload/
          fi
          git rev-parse HEAD > /tmp/tenx-upload/source-revision.txt
          printf '%s\n' 'Provisional training seed 1819 and holdouts 1909,1910; full historical non-use audit still pending.' > /tmp/tenx-upload/seed-audit-warning.txt
          printf '%s\n' 'Synthetic simulator estimates only; not actual Block Blast scores. No checkpoint promotion.' > /tmp/tenx-upload/interpretation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blockblast-tenx-bounded-research-${{ github.run_id }}
          path: /tmp/tenx-upload/
          retention-days: 14
