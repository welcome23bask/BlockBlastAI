name: v2.2 10x Challenge - Bounded Offline Research
on:
  workflow_dispatch:
  push:
    branches: [feature/v2.2-10x-research-gate]
    paths:
      - '.github/workflows/v22-tenx.yml'

permissions:
  contents: read

concurrency:
  group: blockblast-tenx-research
  cancel-in-progress: false

jobs:
  bounded-research:
    if: github.ref == 'refs/heads/feature/v2.2-10x-research-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact research revision and baseline
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cat learning/tenx_checkpoint.txt
          cat learning/tenx_candidate_weights.txt
      - name: Fail-fast seed-policy check before compiling
        shell: bash
        run: |
          set -euo pipefail
          TENX_PREFLIGHT_ONLY=1 TENX_TRAIN_SEED_EPOCH=902 bash learning/run_tenx_reproducible.sh 903 904
      - name: Research-only Python regressions and simulator-derived hazard learning
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -m unittest discover -s learning -p 'test_export_hazard_afterstates.py' -v
          python3 learning/test_hazard_calibration_leakage.py
          python3 learning/test_hazard_episode_balanced_metrics.py
          python3 learning/test_lower_tail_hazard_smoke.py
          # New distinct research-only hypothesis: eight exactly legal complete-tray finalists instead of six; test whether rare shifted-heavy escape routes survive late candidate pruning.
          # Train and validation are independent of downstream policy training
          # (902) and BOTH official holdouts (903/904).
          # Use the unchanged v1.7 policy to label genuine synthetic continuations.
          python3 learning/audit_raw_seed_aliases.py 900 901 902
          python3 learning/audit_raw_seed_aliases.py 902 903 904
          tmp="$(mktemp -d)"
          cc -O2 -std=c11 -Wall -Wextra -Isrc \
             -DBLFindTwoStrategies=BLV17FindTwoStrategies \
             -c src/BLDualStrategy.c -o "$tmp/v17.o"
          cc -O2 -std=c11 -Wall -Wextra -Isrc \
             -c src/BlockBlastSolver.c -o "$tmp/solver.o"
          cc -O2 -std=c11 -Wall -Wextra -Isrc \
             learning/hazard_trace_sim.c "$tmp/v17.o" "$tmp/solver.o" -lm \
             -o "$tmp/hazard_trace_sim"
          "$tmp/hazard_trace_sim" 900 901 10 /tmp/tenx-hazard-traces.jsonl \
             | tee /tmp/tenx-hazard-sim.log
          python3 learning/export_hazard_afterstates.py /tmp/tenx-hazard-traces.jsonl \
             --output /tmp/tenx-hazard-data.csv | tee /tmp/tenx-hazard-export.log
          python3 learning/train_lower_tail_hazard.py /tmp/tenx-hazard-data.csv \
             --output /tmp/tenx-hazard-model.json > /tmp/tenx-hazard-training.log
          python3 - <<'PY'
          import csv,json
          with open('/tmp/tenx-hazard-data.csv',newline='') as f:
              rows=list(csv.DictReader(f))
          model=json.load(open('/tmp/tenx-hazard-model.json'))
          assert len(rows)>0
          assert {x['split'] for x in rows}=={'train','validation'}
          assert {x['scenario'] for x in rows}=={'normal','heavy','shifted-heavy'}
          assert model['train_epochs']==[900]
          assert model['validation_epochs']==[901]
          assert any(int(r['finalist'])>0 for r in rows), 'No alternative legal finalists were generated'
          assert len({(r['epoch'],r['scenario'],r['game'],r['tray'],r['finalist']) for r in rows})==len(rows)
          from collections import Counter
          print('HAZARD_LABEL_COUNTS='+str(sorted(Counter((r['split'],r['scenario'],r['dead_within_3']) for r in rows).items())))
          print('SIMULATOR_HAZARD_PIPELINE=PASS')
          print('MODEL_CALIBRATION_STATUS='+model['status'])
          print('Training and validation only. No gameplay policy integration or 10x claim.')
          PY
      - name: Compile exact source and run one bounded training epoch with two synthetic holdouts
        id: research
        shell: bash
        run: |
          set -o pipefail
          # Epochs audited against accessible ledger and Actions; external history incomplete.
          # Next bounded run: eight-finalist search ablation, same unchanged-v1.7 strict paired gates and fresh audited seed epochs; no checkpoint promotion.
          # Five initial paired training games/generator, up to 4 weight candidates on 8 disjoint training games; eight legal afterstate finalists per strategy search, two 30-game/generator holdouts.
          # The runner preflights ledger and raw RNG starts before compiling; rejects failing verdicts. Never promote a candidate from this job.
          TENX_TRAIN_SEED_EPOCH=902 TENX_TRAIN_GAMES=5 bash learning/run_tenx_reproducible.sh 903 904 2>&1 | tee /tmp/tenx-research-console.txt
      - name: Preserve all available research evidence even on failed gates
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/tenx-upload
          cp /tmp/tenx-research-console.txt /tmp/tenx-upload/console.txt 2>/dev/null || true
          cp /tmp/tenx-hazard-* /tmp/tenx-upload/ 2>/dev/null || true
          evidence="$(sed -n 's/^EVIDENCE_DIRECTORY=//p' /tmp/tenx-research-console.txt 2>/dev/null | tail -n 1 || true)"
          if [[ -n "$evidence" && -d "$evidence" ]]; then
            cp -a "$evidence"/. /tmp/tenx-upload/
          fi
          git rev-parse HEAD > /tmp/tenx-upload/source-revision.txt
          printf '%s\n' 'Provisional training seed 902 and holdouts 903,904; checked against exact cross-role ledger and accessible historical Actions; unrecorded external/local historical use cannot be ruled out.' > /tmp/tenx-upload/seed-audit-warning.txt
          printf '%s\n' 'Synthetic simulator estimates only; not actual Block Blast scores. No checkpoint promotion.' > /tmp/tenx-upload/interpretation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blockblast-tenx-bounded-research-${{ github.run_id }}
          path: /tmp/tenx-upload/
          retention-days: 14
