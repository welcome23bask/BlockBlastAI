name: Green Theme + Stable AI Button (Linux regression)
on:
  workflow_dispatch:
  push:
    branches: [feature/v1.6-green-scan-stable-button]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/green-stable-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Green textured screenshot and 3 horizontal 5-bar pieces
        run: |
          clang -O2 -std=c11 -Wall -Wextra tests/test_green_textured_theme.c src/BLVisionCore.c src/BLAdaptiveTheme.c -lm -o /tmp/green
          /tmp/green
      - name: All previously supported colors and solver modes
        run: |
          set -e
          for n in test_vision test_wood_theme test_pink_theme test_palette_variants; do
            clang -O2 -std=c11 tests/${n}.c src/BLVisionCore.c src/BLAdaptiveTheme.c -lm -o /tmp/${n}
            /tmp/${n}
          done
          clang -O2 -std=c11 tests/test_smart_survival.c src/BLDualStrategy.c src/BlockBlastSolver.c -o /tmp/smart
          /tmp/smart
      - name: AI bubble stays visible in the automatic capture loop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("src/BlockBlastOverlay.m").read_text()
          body=s.split("- (void)autoTick {",1)[1].split("- (void)togglePanel {",1)[0]
          assert "_bubble.hidden=YES" not in body
          assert "_bubble.hidden=NO" not in body
          assert "[self blinkGuidesBeforeCapture]" in body
          assert "kBlinkHighlightsLikeV10=YES" in s
          print("AI button never hidden by autoTick; placement guides still blink")
          PY
