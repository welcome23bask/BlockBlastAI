name: v1.4 Combo Penalty vs Survival Sweep
on:
  workflow_dispatch:
  push:
    branches: [feature/v1.4-combo-guard]
    paths:
      - '.github/workflows/v14-combo-sweep.yml'
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        penalty: [0, 2500, 5000, 10000, 20000, 40000]
    name: Combo break penalty ${{ matrix.penalty }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile frozen pinkcombo and combo-guard variant
        run: |
          clang -O3 -std=c11 -Isrc -DBLSolve=BLV13Solve -DBLSolveWithCombo=BLV13SolveWithCombo -c benchmark/v13_combo_solver.c -o /tmp/v13.o
          clang -O3 -std=c11 -Isrc -DBL_COMBO_BREAK_PENALTY=${{ matrix.penalty }} -c src/BlockBlastSolver.c -o /tmp/v14.o
          clang -O3 -std=c11 benchmark/combo_longrun.c /tmp/v13.o /tmp/v14.o -lm -o /tmp/combobench
      - name: Independent mixed-piece runs
        run: /tmp/combobench 60 900 7230000 0 | tee uniform.txt
      - name: Difficult large-piece runs
        run: /tmp/combobench 60 900 8230000 1 | tee difficult.txt
      - name: Another holdout seed group
        run: /tmp/combobench 60 900 9230000 0 | tee holdout.txt
      - uses: actions/upload-artifact@v4
        with:
          name: combo-penalty-${{ matrix.penalty }}
          path: |
            uniform.txt
            difficult.txt
            holdout.txt
