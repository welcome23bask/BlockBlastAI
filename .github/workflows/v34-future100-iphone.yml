name: v3.4 Automatic Vision Occupied-Cell Guard iPhone
on:
  push:
    branches: [feature/v3.4-100-shape-survival-safety]
    paths:
      - 'src/**'
      - 'tests/test_training_zip.c'
      - 'docs/v34-100-future-shape-safety.md'
      - 'scripts/train_v33_color_verifier.py'
      - 'tests/test_v33_*.c'
      - 'tests/test_v34_*.c'
      - 'tests/benchmark_v34_paired_games.c'
      - '.github/workflows/v34-future100-iphone.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify ZIP writer is readable, correct, and path-safe
        run: |
          cc -O2 -std=gnu11 -Wall -Wextra -Werror tests/test_training_zip.c src/BLTrainingZIP.c -o /tmp/test-training-zip
          archive=$(/tmp/test-training-zip)
          python3 - "$archive" <<'PY'
          import sys,zipfile,json
          path=sys.argv[1]
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              assert sorted(z.namelist())==['sample.jpg','sample.json']
              assert z.read('sample.jpg').startswith(bytes.fromhex('ffd8ffe0'))
              labels=json.loads(z.read('sample.json'))
              assert labels['reviewed'] is False and labels['trainable'] is False
          print('PASS iPhone-readable ZIP, CRC, metadata, traversal rejection')
          PY
      - name: Original skin, shape, three-try, and diagonal-piece regressions
        run: |
          for test in test_vision test_wood_theme test_pink_theme test_black_theme test_green_textured_theme; do
            cc -O2 -std=c11 tests/${test}.c src/BLVisionCore.c src/BLAdaptiveTheme.c -lm -o /tmp/${test}
            /tmp/${test}
          done
          cc -O2 -std=c11 tests/test_v31_diagonal_screenshot.c \
            src/BLThreeMoveClear.c src/BLGuideSafety.c src/BLFrameSafety.c \
            src/BLV25Strategy.c src/BLDualStrategy.c src/BlockBlastSolver.c \
            -lm -o /tmp/test-v31
          /tmp/test-v31

      - name: Fifty fresh scan confirmation and learned RGB vision regression
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror tests/test_v33_no_clear_review.c src/BLNoClearReview.c -o /tmp/test-5-checks
          /tmp/test-5-checks
          cc -O2 -std=c11 -Wall -Wextra -Werror tests/test_v33_trained_vision.c src/BLTrainedVision.c -lm -o /tmp/test-learned-vision
          /tmp/test-learned-vision
          cc -O2 -std=c11 -Wall -Wextra -Werror tests/test_v33_timed_deep_search.c \
            src/BLThreeMoveClear.c src/BLGuideSafety.c src/BLFrameSafety.c \
            src/BLV25Strategy.c src/BLDualStrategy.c src/BlockBlastSolver.c \
            -lm -o /tmp/test-v33-timed
          /tmp/test-v33-timed
          python3 - <<'PY'
          from pathlib import Path
          solver=Path('src/BLThreeMoveClear.c').read_text()
          overlay=Path('src/BlockBlastOverlay.m').read_text()
          scanner=Path('src/BLScreenScan.m').read_text()
          assert 'BLFindThreeMoveClearTimed' in solver
          assert 'monotonicMs()>=ctx->deadlineMs' in solver
          assert 'BLFindThreeMoveClearTimed(boardSnapshot' in overlay
          assert 'BLNoClearReviewBegin' in overlay
          assert 'BLNoClearReviewObserve' in overlay
          assert '50 fresh' in overlay.lower()
          assert 'BLNoClearProofIsReady' in overlay
          assert 'no clear available' in overlay
          assert 'BLTrainedVisionOpinionRGBA' in scanner
          assert 'if(trainedOpinion<0 && !lumaVerified)' in scanner
          assert 'if(clearPlan.found)clearPlan.completeSearch=0;' in overlay
          print('PASS timed deep search and no false no-clear after incomplete/invalid candidate')
          PY
      - name: Prove 1000-streak tracking and no-clear notification safety across entire tray
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror tests/test_v34_combo100.c \
            src/BLThreeMoveClear.c src/BLGuideSafety.c src/BLV25Strategy.c \
            src/BLDualStrategy.c src/BlockBlastSolver.c -lm -o /tmp/test-combo100
          /tmp/test-combo100
          cc -O2 -std=c11 -Wall -Wextra -Werror tests/test_v34_no_clear_full_tray.c \
            src/BLThreeMoveClear.c src/BLGuideSafety.c src/BLNoClearReview.c \
            -lm -o /tmp/test-no-clear-full-tray
          /tmp/test-no-clear-full-tray
          python3 - <<'PY'
          from pathlib import Path
          overlay=Path('src/BlockBlastOverlay.m').read_text()
          assert 'BLNoClearProofIsReady' in overlay
          assert 'BL_NO_CLEAR_RECHECKS 50U' in Path('src/BLNoClearReview.h').read_text()
          assert 'BL_COMBO_STREAK_MAX 1000' in Path('src/BlockBlastSolver.h').read_text()
          assert 'Combo %d/1000:' in overlay
          assert 'uint16_t comboRun;' in Path('src/BlockBlastSolver.c').read_text()
          assert 'BLFindThreeMoveClearTimed' in overlay
          assert 'BLComboContext fullTrayWindow={0};' in overlay
          assert '_noClearBanner.hidden=NO;' in overlay
          assert 'no clear available' in overlay
          print('PASS exact on-game no-clear wording only after all-tray proof and fifty new frames')
          PY
      - name: Validate 100 different future shapes and 100 seeded strategy scenarios
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror tests/test_v34_future100.c \
            src/BLFuture100.c src/BLThreeMoveClear.c src/BLGuideSafety.c \
            src/BLFrameSafety.c src/BLV25Strategy.c src/BLDualStrategy.c \
            src/BlockBlastSolver.c -lm -o /tmp/test-future-100
          /tmp/test-future-100
          cc -O2 -std=c11 -Wall -Wextra -Werror tests/test_v34_100_scenarios.c \
            src/BLFuture100.c src/BLThreeMoveClear.c src/BLGuideSafety.c \
            src/BLFrameSafety.c src/BLV25Strategy.c src/BLDualStrategy.c \
            src/BlockBlastSolver.c -lm -o /tmp/test-100-scenarios
          /tmp/test-100-scenarios
          for seed in 16223123 28354711 41991171; do
            cc -O2 -std=c11 -Wall -Wextra -Werror -DBL_SCENARIO_SEED=${seed} tests/test_v34_100_scenarios.c \
              src/BLFuture100.c src/BLThreeMoveClear.c src/BLGuideSafety.c \
              src/BLFrameSafety.c src/BLV25Strategy.c src/BLDualStrategy.c \
              src/BlockBlastSolver.c -lm -o /tmp/test-100-scenarios-independent
            /tmp/test-100-scenarios-independent
          done
          python3 - <<'PY'
          from pathlib import Path
          ui=Path('src/BlockBlastOverlay.m').read_text()
          assert 'BLFuture100GuardedChoice' in ui
          assert 'if(smartMode)' in ui and 'BLFuture100GuardedChoice' in ui
          assert 'if(smartMode)' in ui and 'BLFindThreeMoveClearTimed' in ui
          print('PASS future-100 gated within Smart Survival; current combo-clear override retained')
          PY
      - name: Test independent contrast scanner and one-placement auto-drag gate
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror tests/test_v34_contrast_themes.c \
            src/BLVisionContrast.c -lm -o /tmp/test-v34-contrast
          /tmp/test-v34-contrast
          cc -O2 -std=c11 -Wall -Wextra -Werror tests/test_v34_reviewed_theme_samples.c \
            src/BLVisionContrast.c -lm -o /tmp/test-reviewed-theme
          /tmp/test-reviewed-theme
          cc -O2 -std=c11 -Wall -Wextra -Werror tests/test_v34_auto_drag.c \
            src/BLAutoDrag.c src/BLGuideSafety.c -lm -o /tmp/test-v34-auto-drag
          /tmp/test-v34-auto-drag
          python3 - <<'PY'
          from pathlib import Path
          overlay=Path('src/BlockBlastOverlay.m').read_text()
          screen=Path('src/BLScreenScan.m').read_text()
          assert 'toggleAutoPlay' in overlay
          assert 'startOneAutomaticDrag' in overlay
          assert 'BLAutoBuildDrag' in overlay
          assert 'BLIsExpectedTransition' in overlay
          assert 'BLInferObservedPlacement' in overlay
          assert '_stableAutoFrames>=5' in overlay
          assert 'BLInProcessTouch isAvailable' in overlay
          assert 'BLAutoDetectDetailed' in screen
          assert 'BLVisionLumaBoard' in screen
          assert 'BLAutoTargetIsProvenEmpty' in overlay
          assert '_autoVisionVerified' in overlay
          assert 'independentlyEmpty' in overlay
          assert 'BLVisionContrastBoard' in screen
          assert 'Native vision uncertain.' in screen
          assert 'src/BLInProcessTouch.m' in Path('.github/workflows/v34-future100-iphone.yml').read_text()
          print('PASS automatic opt-in, five-scan gate, one drag, verified legal transition, and color correction wiring')
          PY
      - name: Verify partial-tray rescue without sacrificing expiring combo
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror tests/test_v34_full_tray_rescue.c \
            src/BLFuture100.c src/BLGuideSafety.c -lm -o /tmp/test-v34-rescue
          /tmp/test-v34-rescue
      - name: Prove no-clear upper-bound pruning preserves real combo rescues
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror tests/test_v34_clear_pruning.c \
            src/BLThreeMoveClear.c src/BLGuideSafety.c -lm -o /tmp/test-v34-pruning
          /tmp/test-v34-pruning
      - name: Paired multi-round synthetic survival and combo benchmark
        run: |
          cc -O3 -std=c11 -Wall -Wextra -Werror tests/benchmark_v34_paired_games.c \
            src/BLFuture100.c src/BLThreeMoveClear.c src/BLGuideSafety.c \
            src/BLFrameSafety.c src/BLV25Strategy.c src/BLDualStrategy.c \
            src/BlockBlastSolver.c -lm -o /tmp/benchmark-v34-games
          timeout 180s /tmp/benchmark-v34-games
      - name: Inspect user consent, crop, stability and unreviewed metadata controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          c=Path('src/BLTrainingCollector.m').read_text()
          ui=Path('src/BlockBlastOverlay.m').read_text()
          assert '_enabled=NO' in c
          assert '@"reviewed":@NO' in c and '@"trainable":@NO' in c
          assert 'CGRectIntersection(pixelCrop' in c
          assert 'kTrainingMaximum=200' in c
          assert 'kTrainingMinimumGap=1.5' in c
          assert 'BLCapturedPieceLabels' in c
          assert 'BLTrainingWriteZIP' in c
          assert '_stableAutoFrames>=3' in ui
          assert '_trainingStableSince>=0.65' in ui
          assert 'toggleVisionTraining' in ui
          assert 'exportVisionTraining' in ui
          assert 'deleteAllWithCompletion' in ui
          assert 'BLV25FindTwoStrategies' in ui
          assert 'BLFindThreeMoveClear' in ui
          print('PASS: explicit opt-in, sandbox-only capture, data review, original smart solver')
          PY
  iphone:
    needs: regression
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile iPhone ARM64 training-enabled library
        run: |
          mkdir -p dist
          xcrun --sdk iphoneos clang -target arm64-apple-ios15.0 \
            -arch arm64 -O3 -fobjc-arc -std=gnu11 -dynamiclib \
            -install_name @rpath/BlockBlastAI.dylib \
            -framework Foundation -framework UIKit -framework CoreGraphics \
            -framework ReplayKit -framework CoreMedia -framework CoreVideo \
            -framework CoreImage -framework Vision -framework CoreML \
            src/BlockBlastOverlay.m src/BLScreenScan.m src/BLVisionCore.c \
            src/BLAdaptiveTheme.c src/BLTransition.c src/BlockBlastSolver.c \
            src/BLDualStrategy.c src/BLV25Strategy.c src/BLGuideSafety.c \
            src/BLFrameSafety.c src/BLThreeMoveClear.c src/BLYOLOVision.m \
            src/BLTrainingCollector.m src/BLTrainingZIP.c \
            src/BLNoClearReview.c src/BLTrainedVision.c \
            src/BLFuture100.c src/BLVisionContrast.c \
            src/BLAutoDrag.c src/BLInProcessTouch.m \
            -o dist/BlockBlastAI.dylib
          file dist/BlockBlastAI.dylib
          test -s dist/BlockBlastAI.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: BlockBlastAI-v34-VERIFIED-THEME-AUTO-SAFE-IPHONE
          path: dist/BlockBlastAI.dylib
