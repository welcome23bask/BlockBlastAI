name: v2.7 Skin-Neutral Structure/Contrast iPhone
on:
  push:
    branches: [feature/v2.7-structure-contrast]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/v27-structure.yml'
  workflow_dispatch:
jobs:
  vision:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Test 256 adaptive palette and occupied-board variants
        run: |
          cc -O2 -std=c11 -Wall -Wextra tests/test_structure_palette.c src/BLStructureVision.c -lm -o /tmp/test_structure_palette
          /tmp/test_structure_palette
      - name: Validate red, black, purple, green, pink, orientations and real-game shape fixtures
        run: |
          for test in test_red_adaptive_theme test_black_theme test_green_textured_theme test_pink_theme test_vision; do
            cc -O2 -std=c11 -Wall -Wextra -DBLVisionAnalyzeRGBA=BLStructureAnalyzeRGBA \
              tests/${test}.c src/BLStructureVision.c -lm -o /tmp/${test}-structure
            /tmp/${test}-structure
          done
  iphone:
    needs: vision
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile full iPhone arm64 dynamic library using structure scanner
        run: |
          mkdir -p dist
          xcrun --sdk iphoneos clang -target arm64-apple-ios15.0 \
            -arch arm64 -O3 -fobjc-arc -std=gnu11 -dynamiclib \
            -install_name @rpath/BlockBlastAI.dylib \
            -framework Foundation -framework UIKit -framework CoreGraphics \
            -framework ReplayKit -framework CoreMedia -framework CoreVideo \
            -framework CoreImage -framework Vision -framework CoreML \
            src/BlockBlastOverlay.m src/BLScreenScan.m src/BLVisionCore.c \
            src/BLStructureVision.c src/BLAdaptiveTheme.c src/BLTransition.c \
            src/BlockBlastSolver.c src/BLDualStrategy.c src/BLV25Strategy.c \
            src/BLYOLOVision.m -o dist/BlockBlastAI.dylib
          file dist/BlockBlastAI.dylib
          test -s dist/BlockBlastAI.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: BlockBlastAI-v27-STRUCTURE-CONTRAST-IPHONE-BETA
          path: dist/BlockBlastAI.dylib
