name: v1.3 PINK + COMBO — Scanner and iPhone Verification
on:
  workflow_dispatch:
  push:
    branches: [feature/v1.3-pink-combo-lab]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benchmark/**'
      - '.github/workflows/pink-combo.yml'
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Original blue/navy board and orientation
        run: |
          clang -std=c11 -O3 tests/test_vision.c src/BLVisionCore.c src/BLAdaptiveTheme.c -lm -o /tmp/vision
          /tmp/vision
      - name: Wood/brown skin regression
        run: |
          clang -std=c11 -O3 tests/test_wood_theme.c src/BLVisionCore.c src/BLAdaptiveTheme.c -lm -o /tmp/wood
          /tmp/wood
      - name: Pink near-background 3x3 theme regression
        run: |
          clang -std=c11 -O3 tests/test_pink_theme.c src/BLVisionCore.c src/BLAdaptiveTheme.c -lm -o /tmp/pink
          /tmp/pink
      - name: Exact transition, 3-move combo persistence and refill detection
        run: |
          clang -std=c11 -O3 tests/test_combo_tracking.c src/BLTransition.c src/BlockBlastSolver.c -lm -o /tmp/combo
          /tmp/combo
          clang -std=c11 -O3 tests/test_transition.c src/BLTransition.c src/BlockBlastSolver.c -o /tmp/transition
          /tmp/transition
      - name: Move legality, rescue and independent state oracle
        run: |
          clang -std=c11 -O3 tests/test_solver.c src/BlockBlastSolver.c -o /tmp/solver
          /tmp/solver
          clang -std=c11 -O3 tests/test_solver_paths.c src/BlockBlastSolver.c -o /tmp/path
          /tmp/path
          clang -std=c11 -O3 tests/test_full_tray_rescue.c src/BlockBlastSolver.c -o /tmp/rescue
          /tmp/rescue
      - name: Browser simulator
        run: node simulator/test.js
      - name: Compile production iOS ARM64 dylib with blink overlays unchanged
        run: |
          mkdir -p dist
          xcrun --sdk iphoneos clang -target arm64-apple-ios15.0 \
            -arch arm64 -O3 -fobjc-arc -std=gnu11 -dynamiclib \
            -install_name @rpath/BlockBlastAI.dylib \
            -framework Foundation -framework UIKit -framework CoreGraphics \
            -framework ReplayKit -framework CoreMedia -framework CoreVideo -framework CoreImage \
            src/BlockBlastOverlay.m src/BLScreenScan.m src/BLVisionCore.c \
            src/BLAdaptiveTheme.c src/BLTransition.c src/BlockBlastSolver.c \
            -o dist/BlockBlastAI.dylib
          file dist/BlockBlastAI.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: BlockBlastAI-v13-PINK-COMBO-iOS-arm64
          path: dist/BlockBlastAI.dylib
      - name: Paired long-run v1.1 baseline versus new combo logic
        run: |
          clang -std=c11 -O3 -Isrc -DBLSolve=BLOldSolve -c benchmark/v11_blink_solver.c -o /tmp/old.o
          clang -std=c11 -O3 -Isrc -c src/BlockBlastSolver.c -o /tmp/new.o
          clang -std=c11 -O3 benchmark/longrun_survival.c /tmp/old.o /tmp/new.o -lm -o /tmp/longrun
          /tmp/longrun 100 1000 100000 0 | tee dist/uniform.txt
          /tmp/longrun 100 1000 200000 1 | tee dist/largepiece.txt
          /tmp/longrun 60 1500 620000 0 | tee dist/holdout.txt
          /tmp/longrun 60 1500 720000 2 | tee dist/fairdealing.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BlockBlastAI-v13-PINK-COMBO-benchmark
          path: dist/*.txt
