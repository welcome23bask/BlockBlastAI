name: v1.6 SMART SURVIVAL + optional YOLOv8n Core ML iPhone build
on:
  workflow_dispatch:
  push:
    branches: [feature/v1.6-smart-survival-yolo]
    paths:
      - 'src/**'
      - 'training/**'
      - '.github/workflows/v16-iphone.yml'
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Validate Smart Survival small one-line combo and five-line screenshot
        run: |
          clang -O3 -std=c11 -Wall -Wextra tests/test_smart_survival.c src/BLDualStrategy.c src/BlockBlastSolver.c -o /tmp/smart
          /tmp/smart
          clang -O3 -std=c11 -Wall -Wextra tests/test_dual_strategy.c src/BLDualStrategy.c src/BlockBlastSolver.c -o /tmp/dual
          /tmp/dual
      - name: Syntax check the real YOLO custom-model training pipeline
        run: python3 -m py_compile training/train_yolov8n.py
      - name: Compile iPhone ARM64 dylib with optional Core ML Vision model runner
        run: |
          mkdir -p dist
          xcrun --sdk iphoneos clang -target arm64-apple-ios15.0 \
            -arch arm64 -O3 -fobjc-arc -std=gnu11 -dynamiclib \
            -install_name @rpath/BlockBlastAI.dylib \
            -framework Foundation -framework UIKit -framework CoreGraphics \
            -framework ReplayKit -framework CoreMedia -framework CoreVideo \
            -framework CoreImage -framework Vision -framework CoreML \
            src/BlockBlastOverlay.m src/BLScreenScan.m src/BLVisionCore.c \
            src/BLAdaptiveTheme.c src/BLTransition.c src/BlockBlastSolver.c \
            src/BLDualStrategy.c src/BLYOLOVision.m \
            -o dist/BlockBlastAI.dylib
          file dist/BlockBlastAI.dylib
      - name: Upload iPhone dylib without missing-trained-model false claims
        uses: actions/upload-artifact@v4
        with:
          name: BlockBlastAI-v16-SMART-SURVIVAL-Optional-YOLO-ARM64
          path: dist/BlockBlastAI.dylib
      - name: Make training scripts and docs separately downloadable
        run: |
          mkdir -p dist/YoloTraining
          cp training/train_yolov8n.py training/dataset.yaml.example dist/YoloTraining/
          cp docs/v1.6-smart-survival-yolo.md dist/YoloTraining/README.md
          cd dist && zip -qr YoloTrainingKit.zip YoloTraining
      - uses: actions/upload-artifact@v4
        with:
          name: BlockBlastAI-v16-YOLO-Training-Kit
          path: dist/YoloTrainingKit.zip
