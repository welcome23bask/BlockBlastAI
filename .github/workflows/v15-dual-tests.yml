name: v1.5 Dual Strategy - Screenshot Exactness and Safety
on:
  workflow_dispatch:
  push:
    branches: [feature/v1.5-dual-strategy]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/v15-dual-tests.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce real user's 5-line versus 2-line screenshots
        run: |
          set -euxo pipefail
          clang -O3 -std=c11 -Wall -Wextra tests/test_dual_strategy.c src/BLDualStrategy.c src/BlockBlastSolver.c -o /tmp/dual
          /tmp/dual
      - name: Verify old blue, wood, pink and multi-theme scanner remains compatible
        run: |
          set -euxo pipefail
          for name in test_vision test_wood_theme test_pink_theme test_palette_variants; do
            clang -O3 -std=c11 tests/${name}.c src/BLVisionCore.c src/BLAdaptiveTheme.c -lm -o /tmp/${name}
            /tmp/${name}
          done
      - name: Confirm iPhone move legality and streak/transition safety regressions
        run: |
          set -euxo pipefail
          clang -O3 -std=c11 tests/test_combo_tracking.c src/BlockBlastSolver.c src/BLTransition.c -o /tmp/combo
          /tmp/combo
          clang -O3 -std=c11 tests/test_hard_combo_guard.c src/BlockBlastSolver.c src/BLTransition.c -o /tmp/hard
          /tmp/hard
          clang -O3 -std=c11 tests/test_full_tray_rescue.c src/BlockBlastSolver.c -o /tmp/rescue
          /tmp/rescue
          node simulator/test.js
