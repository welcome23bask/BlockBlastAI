name: v1.7 BLACK BLOCK Vision iPhone ARM64 Build
on:
  workflow_dispatch:
  push:
    branches: [feature/v1.7-black-block-vision]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/v17-black-iphone.yml'
jobs:
  iphone:
    runs-on: macos-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Test black-theme screenshot geometry and previous green/pink skins
        run: |
          clang -O3 -std=c11 tests/test_black_theme.c src/BLVisionCore.c src/BLAdaptiveTheme.c -lm -o /tmp/black
          /tmp/black
          clang -O3 -std=c11 tests/test_green_textured_theme.c src/BLVisionCore.c src/BLAdaptiveTheme.c -lm -o /tmp/green
          /tmp/green
          clang -O3 -std=c11 tests/test_pink_theme.c src/BLVisionCore.c src/BLAdaptiveTheme.c -lm -o /tmp/pink
          /tmp/pink
          clang -O3 -std=c11 tests/test_smart_survival.c src/BLDualStrategy.c src/BlockBlastSolver.c -o /tmp/smart
          /tmp/smart
      - name: Compile SMART SURVIVAL plus one-color black vision for iPhone
        run: |
          mkdir -p dist
          xcrun --sdk iphoneos clang -target arm64-apple-ios15.0 \
            -arch arm64 -O3 -fobjc-arc -std=gnu11 -dynamiclib \
            -install_name @rpath/BlockBlastAI.dylib \
            -framework Foundation -framework UIKit -framework CoreGraphics \
            -framework ReplayKit -framework CoreMedia -framework CoreVideo \
            -framework CoreImage -framework Vision -framework CoreML \
            src/BlockBlastOverlay.m src/BLScreenScan.m src/BLVisionCore.c \
            src/BLAdaptiveTheme.c src/BLTransition.c src/BlockBlastSolver.c \
            src/BLDualStrategy.c src/BLYOLOVision.m \
            -o dist/BlockBlastAI.dylib
          file dist/BlockBlastAI.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: BlockBlastAI-v17-BLACK-BLOCK-ARM64
          path: dist/BlockBlastAI.dylib
