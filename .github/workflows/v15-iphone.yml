name: v1.5 Two-Mode Block Blast iPhone ARM64 Build
on:
  workflow_dispatch:
  push:
    branches: [feature/v1.5-dual-strategy]
    paths:
      - 'src/**'
      - '.github/workflows/v15-iphone.yml'
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify five-clear versus keep-combo screenshot
        run: |
          clang -O3 -std=c11 -Wall -Wextra tests/test_dual_strategy.c src/BLDualStrategy.c src/BlockBlastSolver.c -o /tmp/dual
          /tmp/dual
      - name: Compile iPhone ARM64 with new local two-mode solver and blinking guides
        run: |
          mkdir -p dist
          xcrun --sdk iphoneos clang -target arm64-apple-ios15.0 \
            -arch arm64 -O3 -fobjc-arc -std=gnu11 -dynamiclib \
            -install_name @rpath/BlockBlastAI.dylib \
            -framework Foundation -framework UIKit -framework CoreGraphics \
            -framework ReplayKit -framework CoreMedia -framework CoreVideo -framework CoreImage \
            src/BlockBlastOverlay.m src/BLScreenScan.m src/BLVisionCore.c \
            src/BLAdaptiveTheme.c src/BLTransition.c src/BlockBlastSolver.c \
            src/BLDualStrategy.c \
            -o dist/BlockBlastAI.dylib
          file dist/BlockBlastAI.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: BlockBlastAI-v15-TWO-MODES-iOS-arm64
          path: dist/BlockBlastAI.dylib
